# Standalone UI Testing compose — same as dev but with remapped host ports
# to avoid conflicts with native postgres/redis/vite on the host machine.
#
# URLs after start:
#   Frontend (Vite): http://localhost:15173
#   API (Django):    http://localhost:18000
#
# Usage: docker compose -f docker-compose.uitest.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: awsexam_dev
      POSTGRES_USER: awsexam
      POSTGRES_PASSWORD: devpassword
    ports:
      - "15432:5432"
    volumes:
      - uitest_postgres_data:/var/lib/postgresql/data
    networks:
      - uitest_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awsexam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - uitest_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "1"
      DATABASE_URL: postgresql://awsexam:devpassword@db:5432/awsexam_dev
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      DB_NAME: awsexam_dev
      DB_USER: awsexam
      DB_PASSWORD: devpassword
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uitest_net
    ports:
      - "18000:8000"
    volumes:
      - ./apps/backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://api:8000
    networks:
      - uitest_net
    ports:
      - "15173:5173"
    volumes:
      - ./apps/frontend:/app
      - uitest_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  uitest_postgres_data:
  uitest_node_modules:

networks:
  uitest_net:
