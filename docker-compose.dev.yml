# Local development override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or standalone: docker compose -f docker-compose.dev.yml up
#
# Key differences from production:
#   - Source code hot-reloaded via bind mounts
#   - Django runserver instead of gunicorn
#   - Vite dev server instead of pre-built static bundle
#   - Direct port exposure (no nginx required)
#   - DEBUG=1, relaxed security settings
#   - No TLS

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awsexam_dev}
      POSTGRES_USER: ${POSTGRES_USER:-awsexam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"   # expose to host for DB GUIs (e.g. pgAdmin, TablePlus)
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awsexam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"   # expose to host for redis-cli debugging
    volumes:
      - redis_dev_data:/data
    networks:
      - dev_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-awsexam}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-awsexam_dev}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev_net
    ports:
      - "8000:8000"   # directly accessible; no nginx layer in dev
    volumes:
      - ./apps/backend:/app  # live code reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-awsexam}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-awsexam_dev}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev_net
    volumes:
      - ./apps/backend:/app  # live code reload
    command: celery -A config worker --loglevel=debug --concurrency=2 --pool=solo

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    networks:
      - dev_net
    ports:
      - "5173:5173"   # Vite default HMR port; directly accessible
    volumes:
      - ./apps/frontend:/app        # live code reload
      - frontend_node_modules:/app/node_modules  # persist node_modules in volume
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_dev_data:
  redis_dev_data:
  frontend_node_modules:

networks:
  dev_net:
