name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ─── Job 1: Build both images on GH runner ───────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Django backend
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          target: production
          load: true
          tags: aws-exam-be:latest
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      # Build Nginx + React frontend
      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nginx/Dockerfile
          load: true
          tags: aws-exam-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Save and compress images
        run: |
          docker save aws-exam-be:latest | xz -T0 -3 > be_image.tar.xz
          docker save aws-exam-nginx:latest | xz -T0 -3 > nginx_image.tar.xz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            be_image.tar.xz
            nginx_image.tar.xz
          retention-days: 1

  # ─── Job 2: Run pytest against a real Postgres ───────────────────────────────
  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/backend/requirements/dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost
          DJANGO_SETTINGS_MODULE: config.settings.development
          PYTHONPATH: apps/backend
        run: pytest apps/backend --ds=config.settings.development -v

  # ─── Job 3: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_CONFIG }}" > .env

      - name: Deploy to EC2 via SSH
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15 -i ~/.ssh/id_rsa"

          echo "📡 Connecting to $EC2_HOST..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST "mkdir -p ~/aws-exam-app"

          echo "🧹 Freeing disk on EC2 before upload..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST 'bash -s' << 'PRECLEAN'
            docker compose -f ~/aws-exam-app/docker-compose.yml down --remove-orphans 2>/dev/null || true
            docker system prune -a -f
            echo "✅ Disk after cleanup:"; df -h /
          PRECLEAN

          echo "📤 Uploading images + config..."
          scp $SSH_OPTS \
            be_image.tar.xz \
            nginx_image.tar.xz \
            .env \
            docker-compose.yml \
            $EC2_USER@$EC2_HOST:~/aws-exam-app/

          echo "🚀 Running deploy on EC2..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST 'bash -s' << 'ENDSSH'
            set -e
            cd ~/aws-exam-app

            echo "🧠 Ensuring swap (2GB) for image load..."
            if [ $(free -m | awk '/Swap/ {print $2}') -lt 1000 ]; then
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            echo "📥 Loading backend image..."
            xz -d -c be_image.tar.xz | docker load
            rm be_image.tar.xz

            echo "📥 Loading nginx image..."
            xz -d -c nginx_image.tar.xz | docker load
            rm nginx_image.tar.xz

            echo "⬆️  Pulling postgres + redis images..."
            docker compose pull postgres redis

            echo "⬆️  Starting postgres + redis..."
            docker compose up -d postgres redis

            echo "⏳ Waiting for DB to be healthy..."
            for i in $(seq 1 12); do
              docker compose exec -T postgres pg_isready -U postgres && break
              echo "  attempt $i/12, retrying in 5s..."
              sleep 5
            done
          ENDSSH

          echo "🔄 Running migrations..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST \
            "cd ~/aws-exam-app && docker compose run --rm django python manage.py migrate --no-input"

          echo "📁 Collecting static files..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST \
            "cd ~/aws-exam-app && docker compose run --rm --user root django python manage.py collectstatic --no-input"

          echo "🔄 Starting all services..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST \
            "cd ~/aws-exam-app && docker compose up -d"

          echo "✅ Deploy done!"
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST \
            "cd ~/aws-exam-app && docker compose ps"
