    \ 5s\n      retries: 5\n\n  redis:\n    image: redis:7-alpine\n    restart: unless-stopped\n\
    \    command: redis-server --appendonly yes\n    volumes:\n      - redis_data:/data\n\
    \    networks:\n      - backend_net\n    healthcheck:\n      test: [\"CMD\", \"\
    redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries:\
