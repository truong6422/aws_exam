- path: docker/backend/Dockerfile
  snippet: "# Backend Dockerfile — multi-stage build\n# Stages:\n#   base        →\
    \ shared OS deps + Python env\n#   development → base + dev/test tools, no source\
    \ copy (bind-mounted at runtime)\n#   production  → base + source copy + prod\
    \ deps, lean final image\n\n# ── base ──────────────────────────────────────────────────────────────────────\n\
    FROM python:3.12-slim AS base\n\nENV PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1\
    \ \\\n    PIP_NO_CACHE_DIR=1 \\\n    PIP_DISABLE_PIP_VERSION_CHECK=1\n\n# System\
    \ packages required by psycopg2, Pillow, and Channels\nRUN apt-get update && apt-get\
    \ install -y --no-install-recommends \\\n        build-essential \\\n        libpq-dev\
    \ \\\n        curl \\\n    && rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app\n\n\
    # ── development ───────────────────────────────────────────────────────────────\n\
    FROM base AS development\n\n# Install base + dev deps (includes pytest, ruff,\
    \ debug-toolbar, etc.)\nCOPY apps/backend/requirements/base.txt requirements/base.txt\n\
    COPY apps/backend/requirements/dev.txt  requirements/dev.txt\nRUN pip install\
    \ --upgrade pip && pip install -r requirements/dev.txt\n\n# Source is bind-mounted\
    \ at runtime — no COPY needed here.\nEXPOSE 8000\nCMD [\"python\", \"manage.py\"\
    , \"runserver\", \"0.0.0.0:8000\"]\n\n# ── production ────────────────────────────────────────────────────────────────\n\
    FROM base AS production\n\n# Install base + prod deps (gunicorn, whitenoise, sentry-sdk)\n\
    COPY apps/backend/requirements/base.txt requirements/base.txt\nCOPY apps/backend/requirements/prod.txt\
    \ requirements/prod.txt\nRUN pip install --upgrade pip && pip install -r requirements/prod.txt\n\
    \n# Copy application source after deps so source changes don't bust the pip layer\n\
    COPY apps/backend/ .\n\n# Non-root user for security\nRUN groupadd --gid 1001\
    \ appuser && \\\n    useradd  --uid 1001 --gid appuser --shell /bin/bash --create-home\
    \ appuser && \\\n    chown -R appuser:appuser /app\n\nUSER appuser\n\nEXPOSE 8000\n\
    # WhiteNoise serves static files directly from the app — no collectstatic volume\
    \ needed.\n# Migrations run here so the container is self-contained on first start.\n\
    CMD [\"sh\", \"-c\", \"python manage.py migrate --noinput && gunicorn config.wsgi:application\
    \ --bind 0.0.0.0:8000 --workers 4 --timeout 120\"]"
- path: docker/frontend/Dockerfile
  snippet: '# Frontend Dockerfile — multi-stage build

    # Stages:

    #   deps        → install node_modules (layer-cached)

    #   development → deps stage, source bind-mounted at runtime, Vite HMR

    #   builder     → full build producing /app/dist

    #   production  → nginx:alpine serving the static /dist bundle


    # ── deps ──────────────────────────────────────────────────────────────────────

    FROM node:20-alpine AS deps


    WORKDIR /app


    # Copy only the manifest — no package-lock.json in this project

    COPY apps/frontend/package.json ./

    # npm install instead of npm ci (no lockfile present)

    RUN npm install


    # ── development ───────────────────────────────────────────────────────────────

    FROM deps AS development


    # Source is bind-mounted at runtime; no full COPY here.

    EXPOSE 5173

    CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]


    # ── builder ───────────────────────────────────────────────────────────────────

    FROM deps AS builder


    COPY apps/frontend/ .


    # Accept build-time env vars (e.g. VITE_API_BASE_URL)

    ARG VITE_API_BASE_URL=/api

    ENV VITE_API_BASE_URL=${VITE_API_BASE_URL}


    RUN npm run build


    # ── production ────────────────────────────────────────────────────────────────

    FROM nginx:1.27-alpine AS production


    # Remove default nginx site; main proxy config lives in the nginx service

    RUN rm /etc/nginx/conf.d/default.conf


    # Copy built static assets

    COPY --from=builder /app/dist /usr/share/nginx/html


    # Lightweight config: serve /usr/share/nginx/html, defer API proxying to

    # the dedicated nginx reverse-proxy container.

    COPY docker/frontend/nginx-spa.conf /etc/nginx/conf.d/default.conf


    EXPOSE 80

    CMD ["nginx", "-g", "daemon off;"]'
- path: docker/nginx/Dockerfile
  snippet: '# Nginx reverse-proxy Dockerfile

    # Copies nginx.conf into a lean nginx:alpine image.

    # SSL certs are mounted at runtime via a volume (see docker-compose.yml).


    FROM nginx:1.27-alpine


    # Remove default config

    RUN rm /etc/nginx/conf.d/default.conf


    COPY docker/nginx/nginx.conf /etc/nginx/nginx.conf


    EXPOSE 80 443

    CMD ["nginx", "-g", "daemon off;"]'
- path: nginx/Dockerfile
  snippet: '# nginx/Dockerfile — multi-stage build

    # Stage 1: build the React SPA

    # Stage 2: nginx:alpine serving the SPA + proxying /api/ to Django

    #

    # Used by docker-compose.prod.yml.

    # The full production nginx (TLS + separate frontend container) lives in

    # docker/nginx/Dockerfile — this is the simplified single-container variant.


    # ── frontend-build ────────────────────────────────────────────────────────────

    FROM node:20-alpine AS frontend-build


    WORKDIR /app


    # Copy manifests first for layer caching

    COPY apps/frontend/package*.json ./

    RUN npm install


    # Copy source and build

    COPY apps/frontend/ ./

    RUN npm run build


    # ── nginx ─────────────────────────────────────────────────────────────────────

    FROM nginx:alpine


    # Remove default nginx config

    RUN rm /etc/nginx/conf.d/default.conf


    # Copy built React SPA

    COPY --from=frontend-build /app/dist /usr/share/nginx/html


    # Copy nginx site config

    COPY nginx/nginx.conf /etc/nginx/conf.d/default.conf


    EXPOSE 80

    CMD ["nginx", "-g", "daemon off;"]'
