- path: apps/backend/core/extra_fields/README.md
  snippet: "Extra Fields for Django Rest Framework\n================\n\nFields:\n\
    ----------------\n\n\n## Base64ImageField\n\nAn image representation for Base64ImageField\n\
    \nInherited from `ImageField`\n\n\n**Signature:** `Base64ImageField()`\n\n - It\
    \ takes a base64 image as a string.\n - A base64 image:  `data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7`\n\
    \ - Base64ImageField accepts the entire string or just the part after base64,\
    \ `R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7`\n - It takes the\
    \ optional parameter `represent_in_base64` (`False` by default), if set to `True`\
    \ it will allow for base64-encoded downloads of an `ImageField`.\n - You can inherit\
    \ the `Base64ImageField` class and set allowed extensions (`ALLOWED_TYPES` list),\
    \ or customize the validation messages (`INVALID_FILE_MESSAGE`, `INVALID_TYPE_MESSAGE`)\n\
    \n\n**Example:**\n\n```python\n# serializer\n\nfrom core.extra_fields import Base64ImageField\n\
    \nclass UploadedBase64ImageSerializer(serializers.Serializer):\n    file = Base64ImageField(required=False)\n\
    \    created = serializers.DateTimeField()\n\n# use the serializer\nfile = 'R0lGODlhAQABAIAAAP///////yH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='\n\
    serializer = UploadedBase64ImageSerializer(data={'created': now, 'file': file})\n\
    ```\n\n\n## Base64FileField\n\nA file representation for Base64FileField\n\nInherited\
    \ from `FileField`\n\n\n**Signature:** `Base64FileField()`\n\n - It takes a base64\
    \ file as a string.\n - Other options like for `Base64ImageField`\n - You have\
    \ to provide your own full implementation of this class. You have to implement\
    \ file validation in `get_file_extension` method and set `ALLOWED_TYPES` list.\n\
    \n\n**Example:**\n\n```python\nclass PDFBase64File(Base64FileField):\n    ALLOWED_TYPES\
    \ = ['pdf']\n\n    def get_file_extension(self, filename, decoded_file):\n   \
    \     try:\n            PyPDF2.PdfFileReader(io.BytesIO(decoded_file))\n     \
    \   except PyPDF2.utils.PdfReadError as e:\n            logger.warning(e)\n  \
    \      else:\n            return 'pdf'\n```\n\n\n## PointField\n\nPoint field\
    \ for GeoDjango\n\n\n**Signature:** `PointField()`\n\n - It takes a dictionary\
    \ contains latitude and longitude keys like below\n\n    {\n     \"latitude\"\
    : 49.8782482189424,\n     \"longitude\": 24.452545489\n    }\n - It takes the\
    \ optional parameter `str_points` (False by default), if set to True it serializes\
    \ the longitude/latitude\n values as strings\n - It takes the optional parameter\
    \ `srid` (None by default), if set the Point created object will have its srid\
    \ attribute set to the same value.\n\n**Example:**\n\n```python\n# serializer\n\
    \nfrom from core.extra_fields import PointField\n\nclass PointFieldSerializer(serializers.Serializer):\n\
    \    point = PointField(required=False)\n    created = serializers.DateTimeField()\n\
    \n# use the serializer\npoint = {\n    \"latitude\": 49.8782482189424,\n    \"\
    longitude\": 24.452545489\n    }\nserializer = PointFieldSerializer(data={'created':\
    \ now, 'point': point})\n```\n\n\n# RangeField\n\nThe Range Fields map to Django's\
    \ PostgreSQL specific [Range Fields](https://docs.djangoproject.com/en/stable/ref/contrib/postgres/fields/#range-fields).\n\
    \nEach accepts an optional parameter `child_attrs`, which allows passing parameters\
    \ to the child field.\n\nFor example, calling `IntegerRangeField(child_attrs={\"\
    allow_null\": True})` allows deserializing data with a null value for `lower`\
    \ and/or `upper`:\n\n```python\nfrom rest_framework import serializers\nfrom core.extra_fields\
    \ import IntegerRangeField\n\n\nclass RangeSerializer(serializers.Serializer):\n\
    \    ranges = IntegerRangeField(child_attrs={\"allow_null\": True})\n\n\nserializer\
    \ = RangeSerializer(data={'ranges': {'lower': 0, 'upper': None}})\n\n```\n\n##\
    \ IntegerRangeField\n\n```python\nfrom rest_framework import serializers\nfrom\
    \ core.extra_fields import IntegerRangeField\n\n\nclass RangeSerializer(serializers.Serializer):\n\
    \    ranges = IntegerRangeField()\n\n\nserializer = RangeSerializer(data={'ranges':\
    \ {'lower': 0, 'upper': 1}})\n\n```\n\n## FloatRangeField\n\n```python\nfrom rest_framework\
    \ import serializers\nfrom core.extra_fields import FloatRangeField\n\n\nclass\
    \ RangeSerializer(serializers.Serializer):\n    ranges = FloatRangeField()\n\n\
    \nserializer = RangeSerializer(data={'ranges': {'lower': 0., 'upper': 1.}})\n\n\
    ```\n\n## DecimalRangeField\n\n```python\nfrom rest_framework import serializers\n\
    from core.extra_fields import DecimalRangeField\n\n\nclass RangeSerializer(serializers.Serializer):\n\
    \    ranges = DecimalRangeField()\n\n\nserializer = RangeSerializer(data={'ranges':\
    \ {'lower': 0., 'upper': 1.}}, )\n\n```\n\n## DateRangeField\n\n```python\nimport\
    \ datetime\n\nfrom rest_framework import serializers\nfrom drf_extra_fields.fields\
    \ import DateRangeField\n\n\nclass RangeSerializer(serializers.Serializer):\n\
    \    ranges = DateRangeField()\n\n\nserializer = RangeSerializer(data={'ranges':\
    \ {'lower': datetime.date(2015, 1, 1), 'upper': datetime.date(2015, 2, 1)}})\n\
    \n```\n\n## DateTimeRangeField\n\n```python\nimport datetime\n\nfrom rest_framework\
    \ import serializers\nfrom core.extra_fields import DateTimeRangeField\n\n\nclass\
    \ RangeSerializer(serializers.Serializer):\n    ranges = DateTimeRangeFie"
