purpose_summary: AWS certification exam practice platform (commercial SaaS). Delivers
  timed, graded practice exams for SAA-C03, CLF-C02, DVA-C02, and SOA-C02 certifications.
  Users authenticate via JWT, attempt questions pulled from a seeded PostgreSQL question
  bank, and receive scored results with server-enforced timers to prevent cheating.
purpose_confidence: 0.95
architecture_overview: 'Three-tier containerised monorepo. Backend: Django 4.x + DRF
  serving REST API at /api/v1/, custom JWT auth (simplejwt override) with Redis token
  blacklist, Celery worker for async tasks, WhiteNoise for static files, Gunicorn
  WSGI in production. Frontend: React 18 SPA built with Vite + TypeScript, Tailwind
  CSS, Zustand state, react-router-dom v6, @sentry/react monitoring. Data layer: PostgreSQL
  16 (primary store) + Redis 7 (JWT blacklist + Celery broker). Reverse proxy: Nginx
  (HTTP/HTTPS) routes /api/* to Django, /* to static React bundle. Two nginx variants
  exist — docker/nginx/ (TLS, separate frontend container) and nginx/ (simplified
  single-container with embedded SPA). Environments: dev (bind-mount hot-reload),
  test (docker-compose.test.yml), prod (docker-compose.yml). Playwright at repo root
  for E2E. Exam question data lives as JSON files under exam-data/ and is seeded via
  Django migrations 0003–0006.'
