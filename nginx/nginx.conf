# nginx/nginx.conf — simplified production config for docker-compose.prod.yml
# Topology:
#   Client → nginx:80
#              ├─ /api/*      → django:8000  (Gunicorn / Django REST)
#              ├─ /admin/*    → django:8000  (Django admin)
#              ├─ /health/*   → django:8000  (health check endpoint)
#              ├─ /static/*   → /usr/share/nginx/static/ (collectstatic output)
#              └─ /           → /usr/share/nginx/html/   (React SPA)
#
# For TLS termination, use the full stack in docker/nginx/nginx.conf instead.

server {
    listen 80;
    server_name _;

    # Allow large JSON imports (exam question sets, etc.)
    client_max_body_size 10M;

    # ── Django static files (collectstatic output) ────────────────────────────
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://django:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # ── Django admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health/ {
        proxy_pass       http://django:8000;
        proxy_set_header Host $host;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────────
    # Serves index.html for all unmatched routes — enables React Router deep links.
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
        expires    -1;
        add_header Cache-Control "no-store";
    }
}
