# Minimal nginx config for the frontend container.
# Serves the Vite-built SPA from /usr/share/nginx/html.
# All unknown paths fall back to index.html for client-side routing.
# API proxying is handled by the dedicated nginx reverse-proxy container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache TTL (Vite content-hashes filenames)
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let React Router handle all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
