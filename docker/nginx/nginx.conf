# Nginx reverse-proxy configuration
# Topology:
#   Client → nginx:80/443
#              ├─ /api/*          → api:8000   (Django / Gunicorn)
#              ├─ /admin/*        → api:8000   (Django admin)
#              ├─ /static/*       → static volume (Django collectstatic output)
#              ├─ /media/*        → media volume  (user-uploaded files)
#              └─ /               → frontend:80  (React SPA)

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;   # allow file uploads up to 20 MB

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream api_upstream {
        server api:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    # ── HTTP → HTTPS redirect (production) ───────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow ACME challenges for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # TLS — certs are bind-mounted from ./docker/nginx/ssl in docker-compose.yml
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Django static files (served directly from volume) ─────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── User-uploaded media files ─────────────────────────────────────────
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # ── Django REST API ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── Django admin ──────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass         http://api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── React SPA (catch-all) ─────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
